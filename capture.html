<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>TCG Lister — Phone Scanner</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f0f; color: #e8e8e8; overflow: hidden; }

    /* Fill the ACTUAL visible viewport. dvh handles mobile browser chrome. */
    #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

    header { flex: 0 0 auto; padding: 10px 16px; padding-top: calc(10px + env(safe-area-inset-top)); background: #1a1a1a; border-bottom: 1px solid #2a2a2a; display: flex; align-items: center; justify-content: space-between; }
    header h1 { font-size: 14px; font-weight: 700; }
    #status { font-size: 12px; color: #4ade80; }
    #status.off { color: #f59e0b; }

    /* Camera fills all remaining space between header and footer */
    #video-wrap { flex: 1 1 auto; position: relative; background: #000; overflow: hidden; min-height: 0; }
    video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    #frame-guide { position: absolute; inset: 10% 8%; border: 3px solid rgba(74,222,128,0.7); border-radius: 14px; pointer-events: none; box-shadow: 0 0 0 100vmax rgba(0,0,0,0.25); }
    #frame-guide::after { content: 'Fit ONE card inside'; position: absolute; top: -24px; left: 0; right: 0; text-align: center; font-size: 11px; color: rgba(255,255,255,0.7); }
    #count-badge { position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,0.65); color: #fff; font-size: 13px; padding: 6px 12px; border-radius: 99px; z-index: 2; }
    #last-card { position: absolute; bottom: 12px; left: 12px; right: 12px; background: rgba(0,0,0,0.7); color: #fff; font-size: 12px; padding: 8px 12px; border-radius: 10px; z-index: 2; display: none; }
    #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity 0.12s; z-index: 3; }

    /* Footer always pinned, always visible */
    footer { flex: 0 0 auto; padding: 14px 16px calc(14px + env(safe-area-inset-bottom)); background: #1a1a1a; border-top: 1px solid #2a2a2a; }
    #capture-btn { width: 100%; padding: 20px; font-size: 18px; font-weight: 700; border-radius: 14px; background: linear-gradient(135deg,#16a34a,#22c55e); color: #fff; border: none; cursor: pointer; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 10px; touch-action: manipulation; }
    #capture-btn:disabled { opacity: 0.55; }
    .hint { text-align: center; font-size: 11px; color: #666; margin-top: 8px; }

    #setup { padding: 40px 24px; text-align: center; }
    #setup input { width: 100%; padding: 14px; font-size: 22px; font-family: monospace; letter-spacing: 4px; text-align: center; text-transform: uppercase; background: #242424; border: 1px solid #363636; border-radius: 10px; color: #e8e8e8; margin: 16px 0; outline: none; }
    #setup button { width: 100%; padding: 14px; font-size: 16px; font-weight: 600; border-radius: 10px; background: #e8e8e8; color: #0f0f0f; border: none; cursor: pointer; }
    .err { color: #ef4444; font-size: 13px; margin-top: 12px; min-height: 18px; }
  </style>
</head>
<body>
<div id="app">
  <!-- Manual session entry if no code in URL -->
  <div id="setup" style="display:none;">
    <h1 style="font-size:18px; margin-bottom:8px;">📷 Phone Scanner</h1>
    <p style="font-size:13px; color:#888;">Enter the 6-character code shown on your computer.</p>
    <input type="text" id="session-input" placeholder="ABC123" maxlength="12" autocapitalize="characters" />
    <button onclick="start()">Connect</button>
    <div class="err" id="setup-err"></div>
  </div>

  <!-- Camera -->
  <header id="cam-header" style="display:none;">
    <h1>📷 Scanning</h1>
    <span id="status" class="off">Connecting…</span>
  </header>
  <div id="video-wrap" style="display:none;">
    <video id="video" autoplay playsinline muted></video>
    <div id="frame-guide"></div>
    <div id="count-badge">0 sent</div>
    <div id="last-card"></div>
    <div id="zoom-control" style="position:absolute; left:12px; right:12px; bottom:12px; display:flex; align-items:center; gap:10px; background:rgba(0,0,0,0.55); padding:8px 12px; border-radius:99px; z-index:2;">
      <span style="font-size:13px;">🔍</span>
      <input type="range" id="zoom-slider" min="1" max="4" step="0.1" value="1" style="flex:1; accent-color:#22c55e;" oninput="setZoom(this.value)" />
      <span id="zoom-label" style="font-size:12px; min-width:34px; text-align:right;">1.0×</span>
    </div>
    <div id="flash"></div>
  </div>
  <footer id="cam-footer" style="display:none;">
    <div id="auto-row" onclick="toggleAuto()" style="display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:12px; cursor:pointer; user-select:none;">
      <span style="font-size:14px; font-weight:600;">🔄 Auto-scan</span>
      <span id="auto-switch" style="width:46px; height:26px; border-radius:99px; background:#363636; position:relative; transition:background 0.2s;">
        <span id="auto-knob" style="position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:left 0.2s;"></span>
      </span>
      <span id="auto-label" style="font-size:13px; color:#888;">off</span>
    </div>
    <button id="capture-btn" onclick="capture()">📸 Capture card</button>
    <p class="hint" id="cam-hint">Fit one card in the green frame, hold steady, tap. Wait for the ✓ before the next.</p>
  </footer>
</div>

<canvas id="canvas" style="display:none;"></canvas>
<canvas id="detect-canvas" width="32" height="32" style="display:none;"></canvas>

<script>
let session = '';
let sent = 0;
let stream = null;
let busy = false;
let digitalZoom = 1;       // software zoom (crop) multiplier
let nativeZoomTrack = null; // camera hardware zoom track, if supported
const COOLDOWN_MS = 1200;  // prevents accidental double-captures

function getParam(name) { return new URLSearchParams(location.search).get(name); }

function init() {
  const s = getParam('s') || getParam('session');
  if (s) { session = s.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,12); start(); }
  else { document.getElementById('setup').style.display = 'block'; }
}

async function start() {
  if (!session) {
    const v = document.getElementById('session-input').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');
    if (!v) { document.getElementById('setup-err').textContent = 'Enter the code from your computer.'; return; }
    session = v;
  }
  document.getElementById('setup').style.display = 'none';
  document.getElementById('cam-header').style.display = 'flex';
  document.getElementById('video-wrap').style.display = 'block';
  document.getElementById('cam-footer').style.display = 'block';

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    });
    const video = document.getElementById('video');
    video.srcObject = stream;
    await video.play().catch(()=>{});

    // Detect hardware zoom support; configure the slider to the camera's range
    try {
      const track = stream.getVideoTracks()[0];
      const caps  = track.getCapabilities ? track.getCapabilities() : {};
      const slider = document.getElementById('zoom-slider');
      if (caps && caps.zoom && caps.zoom.max > caps.zoom.min) {
        nativeZoomTrack = track;
        slider.min = caps.zoom.min;
        slider.max = Math.min(caps.zoom.max, caps.zoom.min + 6);
        slider.step = caps.zoom.step || 0.1;
        slider.value = caps.zoom.min;
        updateZoomLabel(caps.zoom.min, true);
      }
    } catch(e) { /* fall back to digital zoom */ }
  } catch(e) {
    document.getElementById('status').textContent = 'Camera blocked';
    alert('Could not access the camera. Allow camera access in your browser settings and reload this page.');
    return;
  }

  ping();
  setInterval(ping, 20000);
}

async function ping() {
  try {
    await fetch('/api/relay', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ session, ping: 1 }) });
    const st = document.getElementById('status');
    st.textContent = 'Connected'; st.classList.remove('off');
  } catch(e) {
    const st = document.getElementById('status');
    st.textContent = 'Offline'; st.classList.add('off');
  }
}

// ─────────────── Auto-scan (card slinger) ───────────────
let autoScan = false;
let prevFp = null;            // previous frame fingerprint
let lastCapturedFp = null;    // fingerprint of last captured card
let stableFrames = 0;
let autoCooldownUntil = 0;
let autoLoopRunning = false;

// Movement-triggered tuning (mean abs frame diff, 0-255 scale)
const MOVE_THRESHOLD  = 8;    // above this = the card is moving (slinger feeding)
const STILL_THRESHOLD = 3.5;  // below this = frame has settled
const SETTLE_MS       = 650;  // must stay still this long after movement, then scan
const VARIANCE_MIN    = 15;   // frame has a card (not a blank surface)
let movedSinceCapture = true; // require fresh movement before each capture
let settleStart = 0;

function toggleAuto() {
  autoScan = !autoScan;
  const sw = document.getElementById('auto-switch');
  const knob = document.getElementById('auto-knob');
  const label = document.getElementById('auto-label');
  const btn = document.getElementById('capture-btn');
  const hint = document.getElementById('cam-hint');
  if (autoScan) {
    sw.style.background = '#22c55e';
    knob.style.left = '23px';
    label.textContent = 'on'; label.style.color = '#4ade80';
    btn.textContent = '⏸ Auto-scanning — tap to capture now';
    hint.textContent = 'Feed cards with your slinger. Each card is captured automatically once it settles.';
    if (!autoLoopRunning) { autoLoopRunning = true; autoLoop(); }
  } else {
    sw.style.background = '#363636';
    knob.style.left = '3px';
    label.textContent = 'off'; label.style.color = '#888';
    btn.textContent = '📸 Capture card';
    hint.textContent = 'Fit one card in the green frame, hold steady, tap. Wait for the ✓ before the next.';
  }
}

function fingerprint(video) {
  const c = document.getElementById('detect-canvas');
  const ctx = c.getContext('2d');
  // Sample the center frame region (matches the framing guide)
  const vw = video.videoWidth, vh = video.videoHeight;
  const dz = digitalZoom;
  const ix = 0.08 + (1 - 1/dz) * 0.42, iy = 0.10 + (1 - 1/dz) * 0.40;
  ctx.drawImage(video, vw*ix, vh*iy, vw*(1-2*ix), vh*(1-2*iy), 0, 0, 32, 32);
  const d = ctx.getImageData(0, 0, 32, 32).data;
  const gray = new Array(1024);
  let sum = 0;
  for (let i = 0, j = 0; i < d.length; i += 4, j++) {
    const g = (d[i] + d[i+1] + d[i+2]) / 3;
    gray[j] = g; sum += g;
  }
  const mean = sum / 1024;
  let varSum = 0;
  for (let j = 0; j < 1024; j++) varSum += Math.abs(gray[j] - mean);
  gray.variance = varSum / 1024;
  return gray;
}

function frameDiff(a, b) {
  if (!a || !b) return 999;
  let s = 0;
  for (let i = 0; i < 1024; i++) s += Math.abs(a[i] - b[i]);
  return s / 1024;
}

async function autoLoop() {
  if (!autoScan) { autoLoopRunning = false; return; }
  const video = document.getElementById('video');
  if (video.videoWidth && !busy) {
    const fp = fingerprint(video);
    const movement = frameDiff(fp, prevFp);
    prevFp = fp;
    const now = Date.now();
    const hasCard = fp.variance > VARIANCE_MIN;

    if (movement > MOVE_THRESHOLD) {
      // The slinger is feeding a card — motion in progress. Don't scan blurry frames.
      movedSinceCapture = true;
      settleStart = 0;
      setAutoStatus('moving');
    } else if (movement < STILL_THRESHOLD && hasCard && movedSinceCapture) {
      // Frame has gone still after a movement → start/continue the settle timer
      if (!settleStart) settleStart = now;
      else if (now - settleStart >= SETTLE_MS) {
        // Settled long enough → capture ONCE. Won't fire again until the next card moves in.
        movedSinceCapture = false;
        settleStart = 0;
        setAutoStatus('captured');
        capture();
      } else {
        setAutoStatus('settling');
      }
    } else {
      // partial motion / blank — reset settle timer, keep waiting
      settleStart = 0;
      if (!movedSinceCapture) setAutoStatus('ready');
    }
  }
  setTimeout(autoLoop, 110);  // sample ~9x/sec for responsive motion detection
}

function setAutoStatus(state) {
  const st = document.getElementById('status');
  if (!st || !autoScan) return;
  const map = {
    moving:   ['● feeding card…', '#f59e0b'],
    settling: ['● settling…',     '#60a5fa'],
    captured: ['● captured ✓',     '#4ade80'],
    ready:    ['● ready for next', '#4ade80']
  };
  const [txt, col] = map[state] || ['Connected', '#4ade80'];
  st.textContent = txt; st.style.color = col;
}

async function capture() {
  if (busy) return;
  const video = document.getElementById('video');
  if (!video.videoWidth) return;
  const btn = document.getElementById('capture-btn');
  busy = true;
  btn.disabled = true;

  // Flash
  const flash = document.getElementById('flash');
  flash.style.opacity = '0.8';
  setTimeout(() => flash.style.opacity = '0', 130);

  // Crop to the framing guide. Digital zoom tightens the crop further so the card
  // fills the frame and its small collector number stays readable.
  const canvas = document.getElementById('canvas');
  const vw = video.videoWidth, vh = video.videoHeight;
  const dz = digitalZoom;   // 1 = no digital zoom
  const baseInsetX = 0.08, baseInsetY = 0.10;
  const insetX = baseInsetX + (1 - 1/dz) * (0.5 - baseInsetX);
  const insetY = baseInsetY + (1 - 1/dz) * (0.5 - baseInsetY);
  const cropX = vw * insetX, cropY = vh * insetY;
  const cropW = vw * (1 - 2*insetX), cropH = vh * (1 - 2*insetY);
  // Higher output resolution (1500px) so card numbers read accurately
  const maxDim = 1500;
  let outW = cropW, outH = cropH;
  if (outW > maxDim || outH > maxDim) { const sc = maxDim / Math.max(outW, outH); outW = Math.round(outW*sc); outH = Math.round(outH*sc); }
  canvas.width = outW; canvas.height = outH;
  const cx = canvas.getContext('2d');
  cx.imageSmoothingQuality = 'high';
  cx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, outW, outH);
  const base64 = canvas.toDataURL('image/jpeg', 0.9).split(',')[1];

  btn.textContent = '⏳ Sending…';
  try {
    const resp = await fetch('/api/relay', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ session, image: base64, mediaType: 'image/jpeg' })
    });
    const data = await resp.json();
    if (data.configured === false) throw new Error('Sync store not set up');
    if (!resp.ok) throw new Error(data.error || 'Upload failed');
    sent++;
    document.getElementById('count-badge').textContent = sent + ' sent';
    btn.textContent = '✓ Sent!';
    if (navigator.vibrate) navigator.vibrate(40);
  } catch(e) {
    btn.textContent = '⚠ ' + e.message;
  }
  // Cooldown before the next capture; restore the label for the current mode
  setTimeout(() => {
    btn.textContent = autoScan ? '⏸ Auto-scanning — tap to capture now' : '📸 Capture card';
    btn.disabled = false; busy = false;
  }, COOLDOWN_MS);
}

function setZoom(val) {
  val = parseFloat(val);
  if (nativeZoomTrack) {
    // Hardware zoom — best quality
    nativeZoomTrack.applyConstraints({ advanced: [{ zoom: val }] }).catch(()=>{});
    document.getElementById('video').style.transform = '';
    digitalZoom = 1;
    updateZoomLabel(val, true);
  } else {
    // Digital zoom — scale the preview and tighten the capture crop
    digitalZoom = val;
    document.getElementById('video').style.transform = `scale(${val})`;
    document.getElementById('video').style.transformOrigin = 'center center';
    updateZoomLabel(val, false);
  }
}

function updateZoomLabel(val, isNative) {
  const lbl = document.getElementById('zoom-label');
  if (lbl) lbl.textContent = (isNative ? val.toFixed(1) : val.toFixed(1)) + '×';
}

init();
</script>
</body>
</html>
